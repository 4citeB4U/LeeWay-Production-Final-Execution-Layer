name: Production Release Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  production-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check scripts/enforce-sovereign-colony-constitution.mjs
          node --check src/production-release-gate.mjs
          node --test tests/production-release-gate.test.mjs
